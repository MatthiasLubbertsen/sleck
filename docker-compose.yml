# Runs behind a Traefik reverse proxy on its own subdomain (TLS terminates at Traefik).
# Needs an external docker network shared with Traefik; adjust names/resolver to your setup.
services:
  sleck:
    build: .
    image: sleck:latest
    restart: unless-stopped
    environment:
      # OAuth + Events API are optional; leave empty to run on imported browser sessions only
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      ALLOWED_USER_IDS: ${ALLOWED_USER_IDS:-}
      APP_URL: ${APP_URL:?set in .env, e.g. https://sleck.example.com}
      SESSION_SECRET: ${SESSION_SECRET:?set in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set in .env}
    volumes:
      - sleck-data:/data
    networks: [traefik]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.sleck.rule=Host(`${SLECK_HOST:?set SLECK_HOST in .env, e.g. sleck.example.com}`)
      - traefik.http.routers.sleck.entrypoints=websecure
      - traefik.http.routers.sleck.tls.certresolver=letsencrypt
      - traefik.http.services.sleck.loadbalancer.server.port=3000
      # Do not attach a compression middleware to this router: it buffers the SSE stream.

volumes:
  sleck-data:

networks:
  traefik:
    external: true
